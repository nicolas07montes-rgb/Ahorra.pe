<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ahorra.pe</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--tx:#161616;--mu:#6b6b6b;--ac:#e63946;--ok:#1a7f4b;--bd:#e5e5e0}
@media(prefers-color-scheme:dark){:root{--bg:#121212;--card:#1c1c1c;--tx:#f2f2f2;--mu:#a0a0a0;--bd:#2e2e2e}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px}
.logo{font-weight:800;font-size:22px}.logo b{color:var(--ac)}
.hero{text-align:center;padding:28px 20px 12px}.hero h1{margin:6px 0;font-size:clamp(28px,6vw,46px)}
.hero p{color:var(--mu);max-width:560px;margin:0 auto}
.sb{display:flex;justify-content:center;padding:14px 16px 0}
.sb input{width:100%;max-width:520px;padding:12px 16px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px}
.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:16px}
select,input,button{font-family:inherit}
select{padding:9px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;padding:8px 20px 30px;max-width:1100px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:1;background:var(--bd);display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:13px;text-align:center;padding:10px}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.in{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.st{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.nm{font-weight:600}.pr{font-size:20px;font-weight:800}.pr small{font-size:13px;font-weight:500;color:var(--mu)}
.tag{font-size:11px;background:var(--ok);color:#fff;border-radius:6px;padding:2px 6px;align-self:flex-start}
a.btn,button.btn{margin-top:4px;text-align:center;background:var(--ac);color:#fff;text-decoration:none;padding:10px;border-radius:10px;font-weight:600;border:0;font-size:15px;cursor:pointer;display:block;width:100%}
details{font-size:13px}summary{cursor:pointer;color:var(--mu);padding:6px 0}
.of{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--bd)}
.of a{color:var(--tx);font-weight:600}.of.best a{color:var(--ok)}.of span{color:var(--mu)}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:40px}
footer{text-align:center;color:var(--mu);font-size:12px;padding:0 20px 30px}
.lg{background:transparent;border:1px solid var(--bd);color:var(--tx);padding:8px 14px;border-radius:10px;cursor:pointer}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#modal.on{display:flex}
.box{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}
.box input{padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px}
.err{color:var(--ac);font-size:13px;min-height:16px}
.lnk{background:none;border:0;color:var(--mu);cursor:pointer;font-size:13px;text-decoration:underline}
</style>
</head>
<body>
<header><div class="logo">ahorra<b>.pe</b></div><div id="acc"></div></header>
<section class="hero"><h1>Tu outfit, al mejor precio.</h1>
<p>Compara ropa y zapatillas para jóvenes de 18 a 25 años en las tiendas del Perú.</p></section>
<div class="sb"><input id="q" type="search" placeholder="Busca: zapatilla, hoodies, jean, vestido…" autocomplete="off"></div>
<div class="bar">
 <select id="gen"><option value="">Para: Todos</option><option>Mujer</option><option>Hombre</option></select>
 <select id="tie"><option value="">Tienda: Todas</option></select>
 <select id="cat"><option value="">Categoría: Todas</option><option>Zapatillas</option><option>Hoodies y casacas</option><option>Vestidos y faldas</option><option>Pantalones y jeans</option></select>
 <select id="ord"><option value="pr">Precio más bajo</option><option value="az">Nombre A–Z</option></select>
</div>
<main class="grid" id="grid"></main>
<footer>Precios referenciales en soles (S/). Pueden cambiar: confirma siempre en la página oficial de la tienda.</footer>

<div id="modal"><div class="box">
 <b id="mt">Ingresar</b>
 <input id="mn" placeholder="Tu nombre" style="display:none">
 <input id="me" type="email" placeholder="Correo">
 <input id="mp" type="password" placeholder="Contraseña (mín. 6)">
 <div class="err" id="er"></div>
 <button class="btn" id="go">Ingresar</button>
 <button class="lnk" id="sw">¿No tienes cuenta? Crear una</button>
 <button class="lnk" id="cl">Cerrar</button>
</div></div>

<script>
/* ============ EDITA AQUÍ ============
 Cada producto tiene "ofertas": una por tienda, con precio (número o null) y url EXACTA del producto.
 La oferta más barata recibe el botón directo. Agrega todas las tiendas que quieras (20 o más). */
const PRODUCTOS = [
 {nombre:"Nike Air Force 1 '07 LX",genero:"Mujer",categoria:"Zapatillas",ofertas:[
  {tienda:"Nike",precio:639.90,img:"",url:"https://www.nike.com.pe/nike-air-force-1-07-lx-zapatillas-para-mujer/hv5990-172/10991533017.html"}]},
 {nombre:"Nike Air Force 1 Crater",genero:"Mujer",categoria:"Zapatillas",ofertas:[
  {tienda:"Nike",precio:589.90,img:"",url:"https://www.nike.com.pe/zapatillas-para-mujer-nike-air-force-1-crater/dm8914-200/10759253001.html"}]},
 {nombre:"Nike Air Force 1 '07 LV8",genero:"Hombre",categoria:"Zapatillas",ofertas:[
  {tienda:"Nike",precio:null,img:"",url:"https://www.nike.com.pe/nike-air-force-1-07-lv8-zapatillas-para-hombre/fv9346-100/10963295013.html"}]},
 {nombre:"Nike Air Force 1 '07 LX",genero:"Hombre",categoria:"Zapatillas",ofertas:[
  {tienda:"Nike",precio:null,img:"",url:"https://www.nike.com.pe/nike-air-force-1-07-lx-zapatillas-para-hombre/fn5757-100/10963021015.html"}]}
];
/* ==================================== */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>"S/ "+n.toFixed(2);
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const stem=w=>w.length>4&&w.endsWith("es")?w.slice(0,-2):(w.length>3&&w.endsWith("s")?w.slice(0,-1):w);
const words=s=>norm(s).split(/[^a-z0-9]+/).filter(Boolean).map(stem);
PRODUCTOS.forEach(p=>{p.hay=words([p.nombre,p.genero,p.categoria,...p.ofertas.map(o=>o.tienda)].join(" "));
 p.of=[...p.ofertas].sort((a,b)=>(a.precio??1e9)-(b.precio??1e9));p.min=p.of[0].precio});
[...new Set(PRODUCTOS.flatMap(p=>p.ofertas.map(o=>o.tienda)))].sort().forEach(t=>$("tie").add(new Option(t,t)));
function render(){
 const qs=words($("q").value);
 let l=PRODUCTOS.filter(p=>(!$("gen").value||p.genero===$("gen").value)&&(!$("tie").value||p.ofertas.some(o=>o.tienda===$("tie").value))&&(!$("cat").value||p.categoria===$("cat").value)&&qs.every(q=>p.hay.some(h=>h.startsWith(q))));
 l.sort($("ord").value==="az"?(a,b)=>a.nombre.localeCompare(b.nombre):(a,b)=>(a.min??1e9)-(b.min??1e9));
 $("grid").innerHTML=l.length?l.map(p=>{
  const b=p.of[0],n=p.of.length,photo=(p.of.find(o=>o.img)||{}).img;
  const img=photo?`<img src="${esc(photo)}" alt="${esc(p.nombre)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.textContent='Foto no disponible'">`:"Foto pendiente";
  const rows=p.of.map((o,i)=>`<div class="of ${i==0&&o.precio!=null?"best":""}"><a href="${esc(o.url)}" target="_blank" rel="noopener noreferrer">${esc(o.tienda)}</a><span>${o.precio!=null?money(o.precio):"Ver en tienda"}</span></div>`).join("");
  return `<article class="card"><div class="ph">${img}</div><div class="in">
   <div class="st">${esc(p.categoria)} · ${esc(p.genero)}</div><div class="nm">${esc(p.nombre)}</div>
   <div class="pr">${b.precio!=null?money(b.precio):"Ver precio"} <small>en ${esc(b.tienda)}</small></div>
   ${n>1&&b.precio!=null?'<span class="tag">Mejor precio</span>':""}
   <a class="btn" href="${esc(b.url)}" target="_blank" rel="noopener noreferrer">Ir a ${esc(b.tienda)}${n>1?" (la más barata)":""}</a>
   <details><summary>Comparar ${n} ${n==1?"tienda":"tiendas"}</summary>${rows}</details></div></article>`}).join(""):'<div class="empty">No encontramos productos con esa búsqueda.</div>';
}
["q","gen","tie","cat","ord"].forEach(i=>$(i).addEventListener("input",render));render();

/* ===== Login (demo guardado en este navegador; para cuentas reales hace falta un servidor) ===== */
let reg=false;
const get=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const set=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
async function hash(s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return btoa(s)}}
function acc(){const u=get("ap_sesion");$("acc").innerHTML=u?`<span style="font-size:14px;margin-right:8px">Hola, ${esc(u.nombre)}</span><button class="lg" id="out">Salir</button>`:'<button class="lg" id="in">Ingresar</button>';
 if(u)$("out").onclick=()=>{localStorage.removeItem("ap_sesion");acc()};else $("in").onclick=()=>open_(false)}
function open_(r){reg=r;$("mt").textContent=r?"Crear cuenta":"Ingresar";$("go").textContent=r?"Crear cuenta":"Ingresar";$("mn").style.display=r?"":"none";
 $("sw").textContent=r?"¿Ya tienes cuenta? Ingresar":"¿No tienes cuenta? Crear una";$("er").textContent="";$("modal").classList.add("on")}
$("sw").onclick=()=>open_(!reg);$("cl").onclick=()=>$("modal").classList.remove("on");
$("go").onclick=async()=>{const e=$("me").value.trim().toLowerCase(),p=$("mp").value,n=$("mn").value.trim(),us=get("ap_usuarios")||{};
 if(!/^\S+@\S+\.\S+$/.test(e))return $("er").textContent="Correo no válido.";
 if(p.length<6)return $("er").textContent="La contraseña debe tener al menos 6 caracteres.";
 const h=await hash(p);
 if(reg){if(us[e])return $("er").textContent="Ese correo ya está registrado.";if(!n)return $("er").textContent="Escribe tu nombre.";us[e]={nombre:n,h};set("ap_usuarios",us)}
 else if(!us[e]||us[e].h!==h)return $("er").textContent="Correo o contraseña incorrectos.";
 set("ap_sesion",{nombre:us[e].nombre,email:e});$("modal").classList.remove("on");acc()};
acc();
</script>
</body>
</html>
